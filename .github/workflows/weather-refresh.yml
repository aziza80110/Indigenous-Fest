name: 更新17族鄉鎮天氣資料

on:
  push:
    branches: [main]
    paths:
      - "automation/update_weather.py"
      - "automation/weather-locations.json"
      - ".github/workflows/weather-refresh.yml"
  schedule:
    - cron: "20 0,6,12,18 * * *"
      timezone: Asia/Taipei
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cwa-weather-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r automation/requirements.txt
      - name: 擷取中央氣象署368鄉鎮預報並整理17族代表地區
        env:
          CWA_AUTHORIZATION: ${{ secrets.CWA_AUTHORIZATION }}
        run: python automation/update_weather.py
      - name: 發布天氣資料至 GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh CWA township forecasts"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Weather data unchanged."
          fi
